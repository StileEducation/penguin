[package]
name = "penguin_object_id"
version = "0.1.0"
edition = "2021"
authors = ["Nick Spain <nicholas.spain@stileeducation.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hex = "0.4"
magnus = { version = "0.9.0", default-features = false }
object_id = { path = "../../crates/object_id" }

[build-dependencies]
rb-sys-env = "0.2.3"

[dev-dependencies]
rb-sys = "0.9.130"
rb-sys-test-helpers = "0.3.0"
pprof = { version = "0.15.0", features = ["flamegraph", "criterion"] }
criterion = "0.5.0"

[[bench]]
name = "object_id_generation"
harness = false
